# Empêche la base Supabase gratuite de se mettre en pause (pause après 7 jours sans activité)
name: Garder la base active
on:
  schedule:
    - cron: '17 6 * * *'   # tous les jours à 06h17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger la base
        run: |
          curl -fsS "https://vijmvynnantcsevwqswr.supabase.co/rest/v1/settings?select=key&limit=1" \
            -H "apikey: sb_publishable_jHo9RspSuTFrwzkQ-fx4fg_d8kXg2bs" > /dev/null
          echo "Base Supabase active ✅"
